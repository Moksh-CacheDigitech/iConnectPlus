map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

resolver 127.0.0.11 valid=10s ipv6=off;

# Basic request rate limiting (VAPT: unrestricted resource consumption).
# Home dashboard fans out many module GETs; LAN users often share one NAT IP.
limit_req_zone $binary_remote_addr zone=erp_api:10m rate=60r/s;
limit_req_zone $binary_remote_addr zone=erp_web:10m rate=80r/s;
limit_req_zone $binary_remote_addr zone=erp_write:10m rate=5r/s;

server {
    listen 80;
    listen [::]:80;
    server_name _;
    return 301 https://$host:8443$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name 172.16.200.30 _;

    ssl_certificate     /etc/nginx/certs/erp.crt;
    ssl_certificate_key /etc/nginx/certs/erp.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;

    server_tokens off;
    client_max_body_size 50m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-site" always;
    add_header Cross-Origin-Embedder-Policy "credentialless" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; img-src 'self' data: blob: https:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://login.microsoftonline.com https://*.microsoft.com; connect-src 'self' https: wss:; frame-src 'self' https://login.microsoftonline.com https://*.microsoft.com;" always;

    # JSON body for limit_req / upstream 503 so the SPA does not show "Invalid API response".
    error_page 503 = @erp_json_503;
    location @erp_json_503 {
        default_type application/json;
        return 503 '{"success":false,"message":"Too many requests. Please try again later.","errors":[]}';
    }

    location ~ ^/api/procurement/(orders/export|delivery-dispatch|delivery-outcome|delivery-reminder)$ {
        limit_req zone=erp_api burst=180 nodelay;
        set $web_upstream web:3000;
        proxy_pass http://$web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # API throttle (limit_req cannot nest under limit_except on nginx 1.27 alpine).
    location ~ ^/api/v1/.+$ {
        limit_req zone=erp_api burst=180 nodelay;
        set $api_upstream api:8000;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_hide_header Server;
        proxy_read_timeout 300s;
        add_header Cache-Control "no-store" always;
        add_header Pragma "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-site" always;
    }

    location /api/ {
        limit_req zone=erp_api burst=180 nodelay;
        set $api_upstream api:8000;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_hide_header Server;
        proxy_read_timeout 300s;
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
    }

    # Block unauthenticated OpenAPI / Swagger / ReDoc (VAPT High).
    location = /docs { return 404; }
    location = /docs/ { return 404; }
    location = /redoc { return 404; }
    location = /redoc/ { return 404; }
    location = /openapi.json { return 404; }
    location = /openapi.yaml { return 404; }
    location = /swagger { return 404; }
    location = /swagger.json { return 404; }

    location /_next/static/ {
        limit_req zone=erp_web burst=80 nodelay;
        set $web_upstream web:3000;
        proxy_pass http://$web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_hide_header Server;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cross-Origin-Resource-Policy "same-site" always;
    }

    location / {
        limit_req zone=erp_web burst=80 nodelay;
        set $web_upstream web:3000;
        proxy_pass http://$web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_hide_header Server;
        # Next.js sets s-maxage=1y on HTML; that pins old login JS and breaks auth deploys.
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_read_timeout 300s;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
